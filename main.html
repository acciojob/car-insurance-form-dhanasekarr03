<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" placeholder="Name" required>

		<label for="email">Email</label>
		<input type="email" id="email" placeholder="Email" required>

		<label for="male" >Male</label>
		<input type="radio" id="male" name="gender" required>
		<label for="female" >Female</label>
		<input type="radio" id="female" name="gender" required>

		<label for="cars">Car Brands</label>
		<select id="cars">
			<option value="bmw">BMW</option>
			<option value="audi">Audi</option>
			<option value="mercedez">Mercedez</option>
		</select>
		
		
		<label for="carage">Car Age</label>
		<input type="number" id="carage" placeholder="Car Age" required>

		<label for="dop">Date of Purchase (dop)</label>
		<input type="date" id="dop" placeholder="Date of Purchase (dop)" required>

		<label for="password">Password</label>
		<input type="password" id="password" placeholder="Password" required>

		<input type="submit" value="Submit Button">
	</form>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
